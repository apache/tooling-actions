name: Test upload-source-to-atr

on:
  push:
    branches: [main]
    paths: ["upload-source-to-atr/**", ".github/workflows/test-upload-source-to-atr.yml"]
  pull_request:
    branches: [main]
    paths: ["upload-source-to-atr/**", ".github/workflows/test-upload-source-to-atr.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest one, which the action uses.
        python-version: ["3.12", "3"]
    defaults:
      run:
        working-directory: upload-source-to-atr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.11"
          enable-cache: false
      - name: Run the tests
        run: uv run --frozen --managed-python --python "$PYTHON" pytest
        env:
          PYTHON: ${{ matrix.python-version }}
